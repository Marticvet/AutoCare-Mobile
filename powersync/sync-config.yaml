config:
  edition: 3

# All shared access is derived from server-maintained membership and billing
# rows. The client cannot supply an entitlement flag. This intentionally avoids
# parameter-query-only constructs: Sync Streams edition 3 evaluates joins and
# subqueries in stream queries, but its `with:` lookup layer does not.
streams:
  user_data:
    auto_subscribe: true
    queries:
      - SELECT * FROM profiles WHERE id = auth.user_id()
      - |
        SELECT * FROM garages
        WHERE owner_user_id = auth.user_id()
           OR id IN (
             SELECT membership.garage_id
             FROM garage_memberships membership
             INNER JOIN garages shared_garage
               ON shared_garage.id = membership.garage_id
             INNER JOIN billing_customers billing
               ON billing.user_id = shared_garage.owner_user_id
             WHERE membership.user_id = auth.user_id()
               AND membership.status = 'active'
               AND shared_garage.status = 'active'
               AND shared_garage.kind = 'family'
               AND billing.status IN ('active', 'cancelled', 'grace_period', 'billing_issue')
               AND (billing.plan = 'family_monthly' OR billing.plan = 'family_yearly')
           )
      # Pending invitations need the garage name for the in-app inbox, but
      # they must not expose the garage's vehicles or other member records.
      - |
        SELECT * FROM garages
        WHERE id IN (
          SELECT membership.garage_id
          FROM garage_memberships membership
          WHERE membership.user_id = auth.user_id()
            AND membership.status = 'pending'
        )
      - |
        SELECT * FROM garage_memberships
        WHERE garage_id IN (
          SELECT garage.id
          FROM garages garage
          WHERE garage.owner_user_id = auth.user_id()
             OR garage.id IN (
               SELECT membership.garage_id
               FROM garage_memberships membership
               INNER JOIN garages shared_garage
                 ON shared_garage.id = membership.garage_id
               INNER JOIN billing_customers billing
                 ON billing.user_id = shared_garage.owner_user_id
               WHERE membership.user_id = auth.user_id()
                 AND membership.status = 'active'
                 AND shared_garage.status = 'active'
                 AND shared_garage.kind = 'family'
                 AND billing.status IN ('active', 'cancelled', 'grace_period', 'billing_issue')
                 AND (billing.plan = 'family_monthly' OR billing.plan = 'family_yearly')
             )
        )
      - |
        SELECT * FROM garage_memberships
        WHERE user_id = auth.user_id()
          AND status = 'pending'
      - |
        SELECT * FROM fleet_billing_accounts
        WHERE garage_id IN (
          SELECT garage.id
          FROM garages garage
          WHERE garage.owner_user_id = auth.user_id()
        )
      - |
        SELECT * FROM vehicles

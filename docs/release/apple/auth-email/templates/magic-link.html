<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="x-apple-disable-message-reformatting" />
        <title>Your AutoCare Hub sign-in link</title>
    </head>
    <body
        style="
            margin: 0;
            background: #f4f6fa;
            color: #17233f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial,
                sans-serif;
        "
    >
        <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="background: #f4f6fa"
        >
            <tr>
                <td style="padding: 32px 16px">
                    <table
                        role="presentation"
                        width="100%"
                        cellspacing="0"
                        cellpadding="0"
                        style="
                            max-width: 560px;
                            margin: 0 auto;
                            background: #ffffff;
                            border-radius: 18px;
                            overflow: hidden;
                        "
                    >
                        <tr>
                            <td style="padding: 28px 32px; background: #17233f">
                                <span
                                    style="
                                        display: inline-block;
                                        width: 34px;
                                        height: 34px;
                                        line-height: 34px;
                                        text-align: center;
                                        background: #2f6bff;
                                        border-radius: 10px;
                                        color: #ffffff;
                                        font-weight: 800;
                                    "
                                    >AC</span
                                ><span
                                    style="
                                        margin-left: 10px;
                                        color: #ffffff;
                                        font-size: 18px;
                                        font-weight: 700;
                                        vertical-align: 10px;
                                    "
                                    >AutoCare Hub</span
                                >
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 32px">
                                <h1
                                    style="
                                        margin: 0 0 16px;
                                        font-size: 26px;
                                        line-height: 32px;
                                    "
                                >
                                    Your sign-in link
                                </h1>
                                <p
                                    style="
                                        margin: 0 0 24px;
                                        font-size: 16px;
                                        line-height: 24px;
                                        color: #5f6b84;
                                    "
                                >
                                    Use this secure, single-use link to sign in
                                    to AutoCare Hub.
                                </p>
                                <p style="margin: 0 0 24px">
                                    <a
                                        href="{{ .ConfirmationURL }}"
                                        style="
                                            display: inline-block;
                                            padding: 14px 20px;
                                            background: #2f6bff;
                                            border-radius: 10px;
                                            color: #ffffff;
                                            font-size: 16px;
                                            font-weight: 700;
                                            text-decoration: none;
                                        "
                                        >Sign in securely</a
                                    >
                                </p>
                                <p
                                    style="
                                        margin: 0;
                                        font-size: 14px;
                                        line-height: 21px;
                                        color: #5f6b84;
                                    "
                                >
                                    If you did not request this link, you can
                                    safely ignore this email.
                                </p>
                            </td>
                        </tr>
                        <tr>
                            <td
                                style="
                                    padding: 20px 32px;
                                    border-top: 1px solid #dfe4ee;
                                    color: #5f6b84;
                                    font-size: 12px;
                                    line-height: 18px;
                                "
                            >
                                AutoCare Hub · Account security
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
